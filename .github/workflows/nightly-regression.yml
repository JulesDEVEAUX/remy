name: Nightly Regression

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    env:
      # Requis par les parcours e2e qui touchent Supabase Auth (ex. CRUD ingrédients,
      # scopé au foyer de l'utilisateur connecté) — secrets à définir dans les
      # paramètres du repo GitHub. Sans eux, ces specs s'auto-skippent (voir
      # tests/e2e/ingredients.spec.ts).
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm prisma:deploy

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e suite
        id: tests
        continue-on-error: true
        run: |
          pnpm test:e2e 2>&1 | tee /tmp/e2e.log
          exit ${PIPESTATUS[0]}

      - name: Ensure "bug" label exists
        if: steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create bug --color d73a4a --description "Régression détectée automatiquement" --force

      - name: Open issue on failure
        if: steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 60000 /tmp/e2e.log > /tmp/e2e-excerpt.log
          {
            echo "Les tests e2e nocturnes ont échoué sur \`main\` (run [$GITHUB_RUN_ID](${{ github.server_url }}/${{ github.repository }}/actions/runs/$GITHUB_RUN_ID))."
            echo
            echo "### Log (fin de sortie, tronqué à 60 Ko)"
            echo '```'
            cat /tmp/e2e-excerpt.log
            echo '```'
          } > /tmp/issue-body.md
          gh issue create \
            --title "Régression e2e nocturne — $(date -u +%Y-%m-%d)" \
            --label bug \
            --body-file /tmp/issue-body.md
